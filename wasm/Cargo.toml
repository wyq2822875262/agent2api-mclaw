[workspace]
resolver = "2"
members = ["sdk"]

[package]
name = "agent2api-wasm-mclaw"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license-file = "../LICENSE"

[lib]
name = "mclaw"
crate-type = ["cdylib"]

[dependencies]
agent2api-wasm-sdk = { path = "sdk" }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
